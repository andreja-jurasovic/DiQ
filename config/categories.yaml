# Product categories BFT-Adria sells into. Each one says where to look for prospects:
#   places:   Google search phrases, combined with every town of the zone ("rolete Osijek")
#   emajstor: emajstor.hr directory slugs (https://www.emajstor.hr/imenik/<slug>/<town>)
#   nkd:      NKD 2007 main-activity codes in the court register
#   register_name: stems searched in full registered company names
#   site_keywords: category-specific words looked for on the prospect's website (PRIO 4)
categories:
  rolete:
    label: Rolete i sjenila
    brands: [Somfy, SIMU]
    places: [rolete, roletar, žaluzine]
    emajstor: [tende_markize]
    nkd: ["43.32"]
    register_name: [rolet, žaluzin, sjenil]
    site_keywords: [roleta, rolete, žaluzine, venecijaneri, rolo zavjese, komarnici, sjenila, screen]
